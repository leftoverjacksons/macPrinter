[project]
name = "macprinter"
version = "0.1.0"
description = "Kiosk that labels USB Ethernet dongles with their MAC address"
requires-python = ">=3.11"
dependencies = [
    "segno>=1.6",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pymupdf>=1.24", "opencv-python-headless>=4.9", "playwright>=1.44"]

[project.scripts]
macprinter = "macprinter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["macprinter", "macprinter.detect", "macprinter.web"]

[tool.setuptools.package-data]
"macprinter" = ["templates/*.yaml"]
"macprinter.web" = ["static/*"]
